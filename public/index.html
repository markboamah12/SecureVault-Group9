<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault | Final Release</title>
    <style>
        /* Implements the Brave Start Page / Glassmorphism Aesthetic */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Vibrant background gradient to make the frosted glass pop */
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            background-size: cover;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .header h1 {
            margin-top: 0;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 15px;
            opacity: 0.8;
            margin-bottom: 40px;
        }

        .upload-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 40px 20px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .upload-box:hover {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
        }

        input[type="file"] {
            display: block;
            margin: 0 auto 25px auto;
            color: #fff;
            font-size: 14px;
        }

        input[type="file"]::file-selector-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-right: 15px;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .btn {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 176, 155, 0.6);
        }

        .footer {
            margin-top: 20px;
            font-size: 13px;
            opacity: 0.5;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="glass-panel">
        <div class="header">
            <h1>SecureVault</h1>
            <p>Zero-Trust Document Management</p>
        </div>
        <div class="upload-box">
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <input type="file" name="secureFile" required>
                <button type="submit" class="btn">Encrypt & Upload</button>
            </form>
        </div>
        <div class="footer">
            GCTU Capstone Project &bull; Group 9
        </div>
    </div>
</body>
</html>
